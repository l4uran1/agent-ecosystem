# openspec/config.yaml (ecosystem root)
#
# TEMPLATE: replace the `context` with your own and keep the `rules`.
# If `openspec init` adds other keys to this file, keep them.

schema: spec-driven

# Injected into everything OpenSpec generates. Keep it short: only what the agent
# cannot work out by reading the code and that changes how a proposal is designed.
context: |
  Product: <one or two lines on what the product does and for whom>.

  Structure: every folder in the ecosystem repo is a service repo with its own git
  (<list the repos>). Contracts between services (queues, pub/sub channels,
  internal endpoints, shared tables) are in docs/system-map.md.

  Stack: <one line per group of services, without versions>.

  Constraints: <external limits that rule out designs, e.g. app store review,
  third-party API quotas, regulatory requirements>.

  Sensitive areas: listed in docs/product/sensitive-areas.md. A mistake there
  directly hurts customers' trust.

  Language: write proposals, specs and tasks in <language>.

rules:
  proposal:
    - List the ecosystem repos that are affected
    - Check docs/system-map.md and list the queues, channels, internal endpoints or shared tables that change
    - Check docs/product/sensitive-areas.md and say whether it touches a sensitive area and, if so, the risk for users
    - Include a rollback plan
  tasks:
    - Tag each task with the repo it is done in, right after its number, e.g. "- [ ] 1.1 (<repo>) ..."; bootstrap.sh reads these tags to create the branches
    - Every task starts with the test that must fail before implementing
    - The last task of each repo is running its tests, lint and build

# Extra instructions for a workflow step. They live here, not in the generated skills, so
# `openspec update` does not overwrite them. Add your own steps next to archive.
operations:
  archive:
    guidance:
      - >-
        After moving the change to archive/, check that docs/system-map.md is still right:
        compare the contracts between services (queues, pub/sub channels, internal
        endpoints, shared tables, shared credentials) that the change creates, modifies or
        removes, according to its proposal.md, its specs and the merged code, with what the
        map says on the main branch. If nothing needs to change, say so in the summary. If
        it does, update it on the same spec/<id> branch, in a commit separate from the
        archive, add it to the "Changes during implementation" section of the proposal's PR
        description, and warn, with the link to that PR, that the map changed and needs
        review.
